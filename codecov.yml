# Coverage per part of the project, each uploaded by .github/workflows/ci.yml under its flag.
# Informational: coverage is reported, and does not fail a commit.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  daemon:
    paths:
      - daemon/src/
    carryforward: true
  app:
    paths:
      - app/src/
    carryforward: true
  led-reader:
    paths:
      - app/modules/led-reader/cpp/
    carryforward: true
