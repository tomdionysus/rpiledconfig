# Coverage per part of the project, each uploaded by .github/workflows/ci.yml under its flag.
# Informational: coverage is reported, and does not fail a commit. Tests, fuzz targets and
# tools are not counted.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "daemon/tests/"
  - "app/modules/led-reader/cpp/tests/"
  - "app/src/test/"
  - "**/*.test.ts"
  - "tools/"

flags:
  daemon:
    paths:
      - daemon/src/
    carryforward: true
  app:
    paths:
      - app/src/
    carryforward: true
  led-reader:
    paths:
      - app/modules/led-reader/cpp/
    carryforward: true
