#
# The daemon's configuration, with every key it reads. One `key: value` per line; a `#`
# starts a comment; a value is bare, or in quotes when it has a space-hash in it. A key
# the daemon does not read is an error that names the line, so a typo cannot be silently
# ignored.
#
# As shipped this is the Pi's configuration: the real LED, BlueZ and NetworkManager. For
# development on a Mac, copy it to daemon/rpiledconfig.local.conf (git ignores
# *.local.conf) and set the three drivers to fake.
#
# The daemon reads, in order: --config PATH, then $RPILEDCONFIG_CONFIG, then
# /etc/rpiledconfig/rpiledconfig.conf. Relative paths in this file are relative to this
# file, not to wherever the daemon was started from.

# debug, info, warn or error. Lines go to the journal: journalctl -u rpiledconfig.
# Default info.
log.level: info

# How the LED is driven: sysfs (the kernel's LED class) or fake (records, lights
# nothing). Default sysfs on Linux, fake elsewhere.
led.driver: sysfs

# The LED's sysfs node: ACT (the activity LED, the main one; led0 on older boards) or PWR
# (the power LED; led1 on older boards). The package's udev rule gives the service's
# group write access to all four. Default /sys/class/leds/ACT.
led.path: /sys/class/leds/ACT

# Whether the LED lights at brightness 0 rather than at max_brightness. On a Raspberry
# Pi 5 the ACT LED does; without this the camera reads every frame inverted. Default
# false.
led.active_low: false

# How BLE is served: bluez (BlueZ over D-Bus) or fake (a harness nothing connects to).
# Default bluez on Linux, fake elsewhere.
ble.driver: bluez

# The adapter BlueZ advertises on, as its name under /org/bluez (ls /sys/class/bluetooth
# lists them). hci0 is the Pi's own radio unless a USB adapter came up first. It is
# powered on if it is off. Default hci0.
ble.adapter: hci0

# The start of the name this Pi advertises and the app lists: <prefix>-<4 random hex>, the hex
# drawn each time the daemon starts. At most 24 printable ASCII characters.
ble.name_prefix: RPiLEDConfig

# How WiFi is configured: networkmanager (NetworkManager over D-Bus) or fake (answers
# from nothing). Default networkmanager on Linux, fake elsewhere. A connection the app
# configures is saved as rpiledconfig-<ssid>; wifi.forget deletes those and only those.
wifi.driver: networkmanager

# The WiFi interface: its MAC goes in the Wi-Fi Easy Connect bootstrap URI, and its
# wpa_supplicant control socket is /run/wpa_supplicant/<interface>. Default wlan0.
wifi.interface: wlan0

# Wi-Fi Easy Connect, so an Android phone can send the Pi its own network
# (docs/protocol.md): wpa_supplicant (through its control socket, which the package's
# unit reaches through the netdev group), fake (a made-up URI; nothing ever arrives), or
# off. Default fake when wifi.driver is fake, so a trial run never touches the radio, and
# wpa_supplicant otherwise.
wifi.easyconnect: wpa_supplicant

# What an authenticated phone's uninstall does (docs/protocol.md, Uninstalling): systemd
# starts rpiledconfig-uninstall.service, which the package ships and which purges the
# package (the program and its configuration; WiFi connections it saved
# stay); fake logs and removes nothing; off answers uninstall_unavailable. Default systemd
# on Linux, fake elsewhere.
uninstall.driver: systemd

# Stay in setup mode for ever, finish or no finish: for a bench Pi. Default false.
setup.always: false

# Seconds in setup mode before giving up until the next check. Default 900 (15 minutes).
setup.timeout: 900

# Seconds between WiFi checks outside setup mode; setup mode is entered again when the
# connection has gone. Default 60.
setup.recheck: 60

# Whether the app is told this Pi's hostname. When false it shows the one-time key instead, with a
# notice. This is status only: BlueZ still gives the adapter's name, by default the hostname, to
# anything connected (docs/configuration.md).
status.report_hostname: true
