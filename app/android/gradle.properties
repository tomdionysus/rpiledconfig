org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true

# The architectures built; the test phone (Blackview A85) is arm64-v8a. Override with
# -PreactNativeArchitectures=arm64-v8a.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native's new architecture and Hermes, as the 0.86 template has them.
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# VisionCamera: frame processors (the LED reader), and no code scanner: it would bring in
# ML Kit, which gathers device and performance data for Google (app/build.gradle removes the
# rest of it, which this flag leaves in).
VisionCamera_enableFrameProcessors=true
VisionCamera_enableCodeScanner=false
