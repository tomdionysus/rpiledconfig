// The native LED reader: the C++ core in ../cpp, built by CMake, behind the VisionCamera
// frame-processor plugin in src/main/java. Included from android/settings.gradle as :led-reader.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.tomcully.ledreader"
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  buildFeatures {
    buildConfig false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-vision-camera')
}
