plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tomcully.rpiledconfig'
version = '0.2.0'

android {
  namespace "com.tomcully.ledreader"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-vision-camera')
}
