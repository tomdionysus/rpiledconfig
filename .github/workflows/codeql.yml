# CodeQL security analysis, security-and-quality: the daemon's and the LED reader's C++,
# built as in CI, and the app's TypeScript.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  cpp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libboost-dev libssl-dev libsystemd-dev \
            libgtest-dev git ca-certificates

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S daemon -B build-codeql/daemon -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-codeql/daemon -j "$(nproc)"
          cmake -S app/modules/led-reader/cpp -B build-codeql/led-reader -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-codeql/led-reader -j "$(nproc)"

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  typescript:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
