#
# tools/ci.sh's steps on Debian trixie for the daemon and the LED reader: the header and
# format check; release builds on x86-64 and arm64; clang with its thread-safety analysis;
# ASan and UBSan on both, TSan; the fuzz targets; coverage to Codecov. Then the Debian
# package on arm64, linted; a build and test on macOS; the Android release build; and the
# app's typecheck, lint, format and version checks and tests with coverage. There is no
# Bluetooth, LED or phone here: those are checked on a Pi and a phone.
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: tsan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: fuzz, arch: x86-64, runner: ubuntu-24.04 }
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format-19 libclang-rt-19-dev cmake ninja-build pkg-config \
            libboost-dev libssl-dev libsystemd-dev libgtest-dev dbus-daemon git ca-certificates

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config libboost-dev libssl-dev libsystemd-dev libgtest-dev \
            dbus-daemon lcov git ca-certificates \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload daemon coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/daemon.info
          flags: daemon
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload LED reader coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/led-reader.info
          flags: led-reader
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The package as a Pi builds it, on arm64: its tests run inside the build, and lintian
  # fails it on any error or warning.
  deb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev git ca-certificates lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the package's version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: apt-get build-dep -y ./

      - name: Build
        run: tools/build-deb.sh

      - name: Lint
        run: lintian --fail-on error,warning build-deb/*.changes

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build-deb/*.deb

  # The daemon with its fakes, as on the development Mac, and the LED reader.
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install packages
        run: brew install boost openssl@3 googletest ninja

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S daemon -B build/daemon -G Ninja -DCMAKE_BUILD_TYPE=Release -DRPILEDCONFIG_BUILD_TESTING=ON \
            -DRPILEDCONFIG_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build/daemon -j "$(sysctl -n hw.ncpu)"
          cmake -S app/modules/led-reader/cpp -B build/led-reader -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRPILEDCONFIG_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build/led-reader -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: |
          build/daemon/rpiledconfig_tests
          build/led-reader/led_reader_tests

  # The release build, signed with a generated debug key as there is no upload key here:
  # it proves the native modules, the LED reader's JNI and the bundle build.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Build
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run version:check
      - run: npm run coverage

      - name: Upload app coverage
        uses: codecov/codecov-action@v5
        with:
          files: app/coverage/lcov.info
          flags: app
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
