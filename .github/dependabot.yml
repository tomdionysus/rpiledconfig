# Dependabot proposes version updates for the actions CI uses and the app's npm packages,
# monthly and grouped, so a bump is one pull request to review rather than many. A new
# dependency is never proposed: Dependabot only updates what is already there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      app-development:
        dependency-type: development
      app-run-time:
        dependency-type: production
        update-types: [minor, patch]
